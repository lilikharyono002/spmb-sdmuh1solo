<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Observasi Peserta Didik</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: Source Sans Pro, sans-serif;
      background: linear-gradient(135deg, #eaf4ff, #f8fbff);
      min-height: 100vh; color: #1f2937;
    }
    .container { width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .login-card { width: 100%; max-width: 420px; background: #ffffff; border-radius: 20px; padding: 35px 30px; box-shadow: 0 10px 35px rgba(0,0,0,0.10); }
    .logo { width: 75px; height: 75px; margin: 0 auto 15px; border-radius: 50%; background: #1d4ed8; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
    .title { text-align: center; font-size: 24px; font-weight: bold; color: #1e3a8a; margin-bottom: 8px; }
    .subtitle { text-align: center; font-size: 14px; color: #6b7280; line-height: 1.5; margin-bottom: 30px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: bold; color: #374151; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; transition: 0.2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.10); }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 70px; }
    .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: #2563eb; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-login { width: 100%; border: none; padding: 14px; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn-login:hover { background: #1d4ed8; }
    .pesan { display: none; margin-top: 18px; padding: 12px; border-radius: 9px; font-size: 14px; line-height: 1.5; }
    .pesan.error { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .pesan.success { display: block; background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .loading { display: none; text-align: center; margin-top: 15px; color: #2563eb; font-size: 14px; }
    .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #9ca3af; }
    .icon img { width: 70px; height: auto; display: block; margin: 0 auto; object-fit: contain; }
  </style>
</head>
<body>

  <div class="container" id="halamanLogin">
    <div class="login-card">
      <div class="icon">
        <img src="https://drive.google.com/thumbnail?id=1d9AlAABndWNgl_wzYEaONSXIbFcSUaKy&sz=w300" alt="Logo Sekolah">
      </div>
      <div class="title">Portal Hasil Observasi SPMB</div>
      <div class="subtitle">SD Muhammadiyah 1 Ketelan Surakarta</div>

      <form id="formLogin" onsubmit="prosesLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" onclick="togglePassword()">Lihat</button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">LOGIN</button>
      </form>

      <div id="loadingLogin" class="loading">⏳ Sedang memeriksa akun...</div>
      <div id="pesanLogin" class="pesan"></div>
      <div class="footer">Sistem Informasi Observasi Peserta Didik</div>
    </div>
  </div>

  <script>
    // URL Web App Google Apps Script Anda (Ganti dengan URL /exec Anda setelah di-deploy sebagai Web App)
    const URL_BACKEND_GAS = 'https://script.google.com/macros/s/AKfycbyLFGUOvW2aaWgSgt9ihnHqG0gG5bD0cF1mtWSKqlmEkwOgbWfAmA2tI7HlJMuP7yIpzg/exec';

    function togglePassword() {
      const password = document.getElementById('password');
      const tombol = document.querySelector('.toggle-password');
      if (password.type === 'password') {
        password.type = 'text';
        tombol.textContent = 'Sembunyikan';
      } else {
        password.type = 'password';
        tombol.textContent = 'Lihat';
      }
    }

    function tampilkanPesan(pesan, tipe) {
      const el = document.getElementById('pesanLogin');
      el.textContent = pesan;
      el.className = 'pesan ' + tipe;
      el.style.display = 'block';
    }

    function prosesLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnLogin');
      const loading = document.getElementById('loadingLogin');
      const pesan = document.getElementById('pesanLogin');

      if (!username || !password) {
        tampilkanPesan('Username dan password wajib diisi.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'MEMERIKSA...';
      loading.style.display = 'block';
      pesan.style.display = 'none';

      // Menggunakan fetch untuk menghubungi Apps Script Backend via POST/GET
      fetch(URL_BACKEND_GAS + '?action=login&username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password))
        .then(response => response.json())
        .then(result => {
          btn.disabled = false;
          btn.textContent = 'LOGIN';
          loading.style.display = 'none';

          if (result && result.success) {
            tampilkanPesan('Login Berhasil! Selamat datang, ' + result.nama, 'success');
            // Lanjutkan logika dashboard Anda di sini
          } else {
            tampilkanPesan(result && result.message ? result.message : 'Login gagal.', 'error');
          }
        })
        .catch(error => {
          btn.disabled = false;
          btn.textContent = 'LOGIN';
          loading.style.display = 'none';
          console.error(error);
          tampilkanPesan('Terjadi kesalahan saat menghubungi server.', 'error');
        });
    }
  </script>
</body>
</html>
